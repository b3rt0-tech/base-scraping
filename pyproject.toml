[project]
name = "base-scraping"
version = "0.2.0"
description = "Captação e enriquecimento de leads B2B brasileiros, construído sobre o BaseCNPJ"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=1.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "dnspython>=2.6",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.17.3",
]

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = ["integration: chama a API real do BaseCNPJ (usa rede e o token do .env)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# regras fixas para o CI não quebrar quando o ruff mudar o conjunto padrão
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
